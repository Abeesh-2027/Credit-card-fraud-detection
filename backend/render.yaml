services:
  - type: web
    name: fraud-detection-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_USERNAME
        value: admin
      - key: DEMO_PASSWORD
        value: "12345"
      - key: ACCESS_TOKEN_MINUTES
        value: "120"
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health
